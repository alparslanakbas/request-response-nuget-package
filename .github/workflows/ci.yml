name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CD.RequestResponse.sln

      - name: Build
        run: dotnet build CD.RequestResponse.sln -c Release --no-restore

      - name: Test
        run: dotnet test CD.RequestResponse.sln -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Pack main package
        run: dotnet pack src/CD.RequestResponse.Middleware/CD.RequestResponse.Middleware.csproj -c Release --no-build -o artifacts/packages

      - name: Pack compatibility package
        run: dotnet pack src/CD.File-Logger.Middleware/CD.File-Logger.Middleware.csproj -c Release --no-build -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
