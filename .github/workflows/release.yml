name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore CD.RequestResponse.sln

      - name: Build
        run: dotnet build CD.RequestResponse.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test CD.RequestResponse.sln -c Release --no-build -p:Version=${{ steps.version.outputs.value }}

      - name: Pack main package
        run: dotnet pack src/CD.RequestResponse.Middleware/CD.RequestResponse.Middleware.csproj -c Release --no-build -o artifacts/packages -p:Version=${{ steps.version.outputs.value }}

      - name: Pack compatibility package
        run: dotnet pack src/CD.File-Logger.Middleware/CD.File-Logger.Middleware.csproj -c Release --no-build -o artifacts/packages -p:Version=${{ steps.version.outputs.value }}

      - name: Sign in to NuGet with a short-lived credential
        id: login
        uses: NuGet/login@v1
        with:
          user: alparslanakbas

      - name: Publish main package
        run: dotnet nuget push "artifacts/packages/CD.RequestResponse.Middleware.${{ steps.version.outputs.value }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish compatibility package
        run: dotnet nuget push "artifacts/packages/CD.File-Logger.Middleware.${{ steps.version.outputs.value }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ steps.version.outputs.value }}
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
